name: plastr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # web service
  - fastapi>=0.110
  - uvicorn>=0.27
  - jinja2>=3.1
  # alignment: mappy is the minimap2 Python binding; the CLI is a fallback
  - minimap2>=2.24
  - mappy>=2.24
  # optional but pulled in because the search panel is much better with it
  - blast>=2.13
  # tests
  - pytest>=7.4
  - httpx>=0.26
  # Runs the browser-side suite under Node's own test runner. Nothing in web/
  # is built or bundled -- this is only so the drawing code can be tested at
  # all; without it those tests skip and the Python suite is unaffected.
  - nodejs>=18
  - pip:
      - .
